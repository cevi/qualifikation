; Mitigations for CVE-2026-109618 and CVE-2026-109619 (PHP security release of
; 21 Oct 2026). php_admin_* values cannot be overridden by ini_set() or .user.ini.
; Only upgrading to PHP >= 8.5.12 fully fixes the vulnerabilities.
[www]
; CVE-2026-109618: avoid the controllable memory_limit failure. The container
; memory limit in docker-compose.prod.yml acts as the availability boundary.
php_admin_value[memory_limit] = -1

; CVE-2026-109619: block the confirmed session and fatal backtrace paths.
php_admin_flag[session.upload_progress.enabled] = off
php_admin_flag[fatal_error_backtraces] = off
