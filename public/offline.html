<!DOCTYPE html>
<html lang="de-CH">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f3f4f6">
    <title>Keine Verbindung - Cevi Qualitool</title>
    <style>
        :root { color-scheme: light dark; --bg: #f3f4f6; --card: #fff; --text: #374151; --muted: #6b7280; --blue: #1d4ed8; }
        @media (prefers-color-scheme: dark) { :root { --bg: #1c2128; --card: #1f2937; --text: #e5e7eb; --muted: #9ca3af; --blue: #3b82f6; } }
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box;
               background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
        main { max-width: 26rem; background: var(--card); border-radius: 0.5rem; padding: 1.5rem; text-align: center; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
        img { height: 2.5rem; margin-bottom: 1rem; }
        h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
        p { margin: 0 0 1.25rem; color: var(--muted); line-height: 1.5; }
        button { background: var(--blue); color: #fff; border: 0; border-radius: .5rem; padding: .625rem 1.25rem; font-size: .875rem; cursor: pointer; }
    </style>
</head>
<body>
<main>
    <img src="/img/logo.svg" alt="Cevi Qualitool">
    <h1>Keine Verbindung</h1>
    <p>Das Qualitool braucht Internet. Eingaben, die du schon gespeichert hast, sind nicht verloren.</p>
    <button type="button" onclick="location.reload()">Erneut versuchen</button>
</main>
</body>
</html>
